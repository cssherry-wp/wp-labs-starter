version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies"]
    groups:
      all-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/plugins/wp-labs-sdlc/skills/session-dashboard/tests"
    schedule: { interval: "weekly" }
    labels: ["dependencies"]
    groups:
      all-python:
        patterns: ["*"]
