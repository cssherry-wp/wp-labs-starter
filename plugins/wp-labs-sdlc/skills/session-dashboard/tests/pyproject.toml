[project]
name = "session-dashboard-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.8.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
check_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
