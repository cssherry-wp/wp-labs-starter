name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      node: ${{ steps.check.outputs.node }}
      python: ${{ steps.check.outputs.python }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          [ -f package-lock.json ] && echo "node=true" >> "$GITHUB_OUTPUT" || echo "node=false" >> "$GITHUB_OUTPUT"
          [ -f pyproject.toml ] && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"

  npm-audit:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      # Blocking: a high-severity advisory fails the workflow.
      - name: npm audit
        run: npm audit --audit-level=high
      - name: npm audit summary
        if: success()
        run: echo "✅ npm audit found no high-severity advisories" >> "$GITHUB_STEP_SUMMARY"

  pip-audit:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      # Blocking: a known vulnerability in a Python dependency fails the workflow.
      - name: pip-audit
        run: pipx run pip-audit
      - name: pip-audit summary
        if: success()
        run: echo "✅ pip-audit found no known vulnerabilities" >> "$GITHUB_STEP_SUMMARY"

  semgrep:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    container: { image: returntocorp/semgrep }
    steps:
      - uses: actions/checkout@v5
      # Blocking: a semgrep finding or error fails the workflow.
      - name: semgrep
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: semgrep summary
        if: success()
        run: echo "✅ semgrep found no findings" >> "$GITHUB_STEP_SUMMARY"
